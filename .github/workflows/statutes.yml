name: statutes
# Once a week, fetches the articles that the paper quotes from the e-Gov law API again and compares them with the
# record (tools/statutes.js). A difference fails the run. The run writes nothing and opens no issue; the record is
# changed only by a commit in a pull request.
on:
  schedule:
    - cron: '41 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/statutes.js
